<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UXBarter is a credit-based, peer-to-peer usability testing exchange for founders and developers. Test another founder's product for about 3 minutes, earn a credit, and spend it to get feedback on your own. No signup." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://uxbarter.vercel.app/" />

    <!-- Link previews (WhatsApp, Slack, LinkedIn, X, ...). Crawlers do not run JavaScript, so these are static, and
         absolute URLs are required. Every shared invite link (/?ref=CODE) shows this same card.
         The primary production host is uxbarter.vercel.app. The same Vercel project also keeps serving
         peerprobe.vercel.app (the original hostname) as a secondary domain. Both hostnames must stay in the
         Cloudflare Turnstile widget; change these URLs together with the Turnstile hostnames if the domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UXBarter" />
    <meta property="og:url" content="https://uxbarter.vercel.app/" />
    <meta property="og:title" content="UXBarter — Give feedback. Get feedback." />
    <meta property="og:description" content="A credit-based, peer-to-peer usability testing exchange: test another founder's product for about 3 minutes, earn a credit, and spend it to get feedback on your own. No signup." />
    <meta property="og:image" content="https://uxbarter.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="UXBarter: Give feedback. Get feedback." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UXBarter — Give feedback. Get feedback." />
    <meta name="twitter:description" content="A credit-based, peer-to-peer usability testing exchange: test another founder's product for about 3 minutes, earn a credit, and spend it to get feedback on your own. No signup." />
    <meta name="twitter:image" content="https://uxbarter.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="UXBarter: Give feedback. Get feedback." />
    <title>UXBarter — Give feedback. Get feedback.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
